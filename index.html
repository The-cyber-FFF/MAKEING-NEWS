<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <title>arknights · 头条生成器</title>
  <meta name="description" content="输入标题、引言和一张照片，生成一张 arknights 风格的头条图片。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2372161c'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='42' font-weight='700' fill='%23f7f2e8'%3Ea%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="wordmark" aria-label="arknights 头条生成器">
        <span class="wordmark-name">arknights</span>
        <span class="wordmark-rule" aria-hidden="true"></span>
        <span class="wordmark-title">头条生成器</span>
      </p>
    </div>
  </header>

  <main class="workspace">
    <h1 class="visually-hidden">arknights 头条图片生成器</h1>

    <section class="editor" aria-labelledby="editorTitle">
      <div class="column-heading">
        <h2 id="editorTitle">编辑内容</h2>
      </div>

      <div class="field">
        <label for="titleInput">标题</label>
        <textarea id="titleInput" rows="2" maxlength="52" spellcheck="false">英伟达董事会调查发现，CEO黄仁勋跑团遭遇龙类召唤术</textarea>
      </div>

      <div class="field">
        <label for="quoteInput">引言</label>
        <textarea id="quoteInput" rows="2" maxlength="72" spellcheck="false">"对方的龙类召唤术竟然能召唤太古金龙"一位明显受惊的英伟达高管说。</textarea>
      </div>

      <div class="field">
        <span class="field-label" id="photoLabel">右侧图片</span>
        <label class="upload" for="imageInput" role="button" tabindex="0" aria-labelledby="photoLabel uploadText">
          <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/gif" tabindex="-1">
          <img class="upload-thumb" id="uploadThumb" alt="">
          <span class="upload-copy">
            <span id="uploadText">默认金龙</span>
            <span class="upload-hint" id="uploadHint">点击或拖入图片进行更换</span>
          </span>
          <span class="upload-action" id="uploadAction">更换</span>
        </label>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <button class="download" id="downloadButton" type="button">
        <span id="downloadLabel">生成图片</span>
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
          <path d="M10 2.75v9.5m0 0 3.5-3.5M10 12.25l-3.5-3.5M3.25 15.25h13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <p class="output-note">PNG · 2560 × 2076 · 日期自动取今天</p>
    </section>

    <section class="preview" aria-labelledby="previewTitle">
      <div class="column-heading">
        <h2 id="previewTitle">预览</h2>
      </div>
      <div class="preview-stage">
        <canvas id="poster" width="1280" height="1038" role="img" aria-label="头条图片预览"></canvas>
      </div>
    </section>
  </main>

  <script src="assets.js"></script>
  <script src="app.js"></script>
</body>
</html>
